<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tic Tac Toe - By Er Jawwad</title>
  <style>
    :root {
      --bg-outer: #041522;
      --bg-card: #062135;
      --bg-cell: #082b44;
      --primary: #00e5ff;
      --primary-soft: rgba(0, 229, 255, 0.16);
      --primary-glow: rgba(0, 229, 255, 0.45);
      --secondary: #ff4081;
      --secondary-glow: rgba(255, 64, 129, 0.5);
      --text-main: #ffffff;
      --text-muted: #93c5d8;
      --win-bg: rgba(0, 229, 255, 0.25);
    }

    body.theme-purple {
      --bg-outer: #130724;
      --bg-card: #1d0c36;
      --bg-cell: #271147;
      --primary: #c084fc;
      --primary-soft: rgba(192, 132, 252, 0.18);
      --primary-glow: rgba(192, 132, 252, 0.48);
      --secondary: #38bdf8;
      --secondary-glow: rgba(56, 189, 248, 0.5);
      --text-muted: #c4b5fd;
      --win-bg: rgba(192, 132, 252, 0.28);
    }

    body.theme-emerald {
      --bg-outer: #031a15;
      --bg-card: #062820;
      --bg-cell: #0a362c;
      --primary: #10b981;
      --primary-soft: rgba(16, 185, 129, 0.18);
      --primary-glow: rgba(16, 185, 129, 0.48);
      --secondary: #fbbf24;
      --secondary-glow: rgba(251, 191, 36, 0.5);
      --text-muted: #a7f3d0;
      --win-bg: rgba(16, 185, 129, 0.28);
    }

    body.theme-gold {
      --bg-outer: #1a1204;
      --bg-card: #281c07;
      --bg-cell: #36260b;
      --primary: #fbbf24;
      --primary-soft: rgba(251, 191, 36, 0.18);
      --primary-glow: rgba(251, 191, 36, 0.48);
      --secondary: #f87171;
      --secondary-glow: rgba(248, 113, 113, 0.5);
      --text-muted: #fde68a;
      --win-bg: rgba(251, 191, 36, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top, var(--bg-card) 0%, var(--bg-outer) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      transition: background 0.35s ease;
    }

    .top-banner {
      font-size: 0.85rem;
      color: var(--primary);
      text-shadow: 0 0 8px var(--primary-glow);
      margin-bottom: 10px;
      text-align: center;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .game-card {
      width: 100%;
      max-width: 410px;
      background: var(--bg-card);
      border: 2px solid var(--primary);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: 0 0 28px var(--primary-glow), inset 0 0 18px rgba(0, 0, 0, 0.45);
      transition: all 0.3s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .icon-btn {
      background: var(--primary-soft);
      border: 1px solid var(--primary);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .theme-dots {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .dot.active {
      transform: scale(1.22);
      box-shadow: 0 0 10px #fff;
    }

    .title-block {
      text-align: center;
      margin-bottom: 12px;
    }

    .title-block h1 {
      font-size: 1.65rem;
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow);
      letter-spacing: 0.5px;
    }

    .title-block h2 {
      font-size: 1.15rem;
      color: var(--primary);
      margin-top: 2px;
      font-weight: 700;
    }

    .controls-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .pill-group {
      display: flex;
      background: var(--bg-outer);
      border: 1px solid var(--primary);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
    }

    .pill-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .pill-btn.active {
      background: var(--primary);
      color: #021019;
      box-shadow: 0 0 10px var(--primary-glow);
    }

    .status-panel {
      text-align: center;
      background: var(--bg-outer);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .turn-text {
      font-size: 0.98rem;
      font-weight: 700;
      color: #fff;
    }

    .score-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 600;
    }

    .rule-hint {
      font-size: 0.72rem;
      color: var(--primary);
      margin-top: 2px;
      opacity: 0.9;
    }

    .board {
      display: grid;
      gap: 8px;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin: 0 auto 14px;
    }

    .cell {
      background: var(--bg-cell);
      border: 1.5px solid var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
      transition: transform 0.12s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .cell:hover:not(.taken) {
      background: var(--primary-soft);
      box-shadow: 0 0 12px var(--primary-glow);
    }

    .cell:active:not(.taken) {
      transform: scale(0.94);
    }

    .cell.x-mark {
      color: var(--primary);
      text-shadow: 0 0 14px var(--primary-glow);
    }

    .cell.o-mark {
      color: var(--secondary);
      text-shadow: 0 0 14px var(--secondary-glow);
    }

    .cell.win-cell {
      background: var(--win-bg);
      box-shadow: 0 0 18px var(--primary-glow);
      animation: pulseWin 0.8s infinite alternate;
    }

    @keyframes pulseWin {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .bottom-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .action-btn {
      flex: 1;
      background: var(--primary);
      color: #021019;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 14px var(--primary-glow);
      transition: 0.2s;
    }

    .action-btn.secondary {
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      box-shadow: none;
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    /* Modal for Leaderboard */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-card);
      border: 2px solid var(--primary);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 25px var(--primary-glow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-header h3 {
      color: var(--primary);
      font-size: 1.15rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-card {
      background: var(--bg-outer);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-lbl {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="top-banner">🚀 Welcome to My Game — Developed by Er Jawwad</div>

  <div class="game-card">
    <div class="header-bar">
      <button class="icon-btn" id="soundToggle" onclick="toggleSound()">🔊 Sound: ON</button>
      <div class="theme-dots" title="Switch Theme">
        <div class="dot active" style="background:#00e5ff" onclick="setTheme('default', this)"></div>
        <div class="dot" style="background:#c084fc" onclick="setTheme('theme-purple', this)"></div>
        <div class="dot" style="background:#10b981" onclick="setTheme('theme-emerald', this)"></div>
        <div class="dot" style="background:#fbbf24" onclick="setTheme('theme-gold', this)"></div>
      </div>
      <button class="icon-btn" onclick="openStats()">🏆 Stats</button>
    </div>

    <div class="title-block">
      <h1>🎮 Tic Tac Toe</h1>
      <h2>By: Er Jawwad</h2>
    </div>

    <!-- Mode & Board Size Controls -->
    <div class="controls-row">
      <div class="pill-group">
        <button class="pill-btn" id="modeFriend" onclick="setMode('friend')">Friend</button>
        <button class="pill-btn active" id="modeAI" onclick="setMode('ai')">AI</button>
      </div>
      <div class="pill-group">
        <button class="pill-btn active" id="size3" onclick="setSize(3)">3×3</button>
        <button class="pill-btn" id="size4" onclick="setSize(4)">4×4</button>
        <button class="pill-btn" id="size5" onclick="setSize(5)">5×5</button>
      </div>
    </div>

    <!-- AI Difficulty Selector -->
    <div class="controls-row" id="diffRow">
      <div class="pill-group">
        <button class="pill-btn" id="diffEasy" onclick="setDifficulty('easy')">Easy</button>
        <button class="pill-btn active" id="diffMed" onclick="setDifficulty('medium')">Medium</button>
        <button class="pill-btn" id="diffHard" onclick="setDifficulty('hard')">Hard</button>
      </div>
    </div>

    <!-- Status & Scoreboard -->
    <div class="status-panel">
      <div class="turn-text" id="statusText">Level 1 | Your Turn (X)</div>
      <div class="score-text" id="scoreText">Score → You: 0 | A.I: 0 | Draw: 0</div>
      <div class="rule-hint" id="ruleHint">Match 3 in a row to win</div>
    </div>

    <!-- Dynamic Game Grid -->
    <div class="board" id="board"></div>

    <!-- Action Buttons -->
    <div class="bottom-actions">
      <button class="action-btn" onclick="resetRound()">Restart Round</button>
      <button class="action-btn secondary" onclick="resetSessionScore()">Reset Score</button>
    </div>
  </div>

  <!-- Local Leaderboard / Stats Modal -->
  <div class="modal-backdrop" id="statsModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>🏆 Local Leaderboard & Stats</h3>
        <button class="icon-btn" onclick="closeStats()">✕</button>
      </div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="stGames">0</div>
          <div class="stat-lbl">Games Played</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stWinRate">0%</div>
          <div class="stat-lbl">Win Rate</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stStreak">0</div>
          <div class="stat-lbl">Best Win Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stMaxLevel">1</div>
          <div class="stat-lbl">Highest AI Level</div>
        </div>
      </div>
      <div class="bottom-actions">
        <button class="action-btn secondary" onclick="clearSavedStats()">Clear History</button>
        <button class="action-btn" onclick="closeStats()">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Game State
    let boardSize = 3;
    let winLength = 3;
    let gameMode = 'ai'; // 'ai' or 'friend'
    let difficulty = 'medium'; // 'easy', 'medium', 'hard'
    let board = [];
    let currentPlayer = 'X';
    let gameActive = true;
    let aiThinking = false;
    let level = 1;
    let scores = { p1: 0, p2: 0, draw: 0 };
    let soundOn = true;

    // Persistent Local Stats
    const STATS_KEY = 'er_jawwad_ttt_stats_v1';
    let savedStats = JSON.parse(localStorage.getItem(STATS_KEY)) || {
      games: 0,
      wins: 0,
      currentStreak: 0,
      bestStreak: 0,
      maxLevel: 1
    };

    // Offline Web Audio Synthesizer (No external files needed)
    let audioCtx = null;
    function playTone(freq, type = 'sine', duration = 0.1, delay = 0) {
      if (!soundOn) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + duration);
      } catch (e) {}
    }

    function sfxClick() { playTone(520, 'sine', 0.06); }
    function sfxMoveX() { playTone(620, 'triangle', 0.09); }
    function sfxMoveO() { playTone(420, 'triangle', 0.09); }
    function sfxWin() {
      playTone(523.25, 'sine', 0.12, 0);
      playTone(659.25, 'sine', 0.12, 0.1);
      playTone(783.99, 'sine', 0.22, 0.2);
    }
    function sfxLose() {
      playTone(340, 'sawtooth', 0.15, 0);
      playTone(240, 'sawtooth', 0.25, 0.14);
    }
    function sfxDraw() {
      playTone(400, 'sine', 0.12, 0);
      playTone(400, 'sine', 0.12, 0.15);
    }

    function toggleSound() {
      soundOn = !soundOn;
      document.getElementById('soundToggle').textContent = soundOn ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      if (soundOn) sfxClick();
    }

    function setTheme(themeName, el) {
      sfxClick();
      document.body.className = themeName === 'default' ? '' : themeName;
      document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
      el.classList.add('active');
    }

    function setMode(mode) {
      sfxClick();
      gameMode = mode;
      document.getElementById('modeFriend').classList.toggle('active', mode === 'friend');
      document.getElementById('modeAI').classList.toggle('active', mode === 'ai');
      document.getElementById('diffRow').style.display = mode === 'ai' ? 'flex' : 'none';
      scores = { p1: 0, p2: 0, draw: 0 };
      level = 1;
      resetRound();
    }

    function setSize(size) {
      sfxClick();
      boardSize = size;
      winLength = size === 3 ? 3 : 4;
      [3, 4, 5].forEach(s => {
        document.getElementById('size' + s).classList.toggle('active', s === size);
      });
      document.getElementById('ruleHint').textContent = `Match ${winLength} in a row to win`;
      resetRound();
    }

    function setDifficulty(diff) {
      sfxClick();
      difficulty = diff;
      document.getElementById('diffEasy').classList.toggle('active', diff === 'easy');
      document.getElementById('diffMed').classList.toggle('active', diff === 'medium');
      document.getElementById('diffHard').classList.toggle('active', diff === 'hard');
      resetRound();
    }

    function initBoardUI() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      boardEl.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
      const fontSize = boardSize === 3 ? '2.5rem' : boardSize === 4 ? '1.95rem' : '1.55rem';

      for (let i = 0; i < boardSize * boardSize; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.fontSize = fontSize;
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        boardEl.appendChild(cell);
      }
    }

    function resetRound() {
      board = Array(boardSize * boardSize).fill('');
      currentPlayer = 'X';
      gameActive = true;
      aiThinking = false;
      initBoardUI();
      updateStatus();
    }

    function resetSessionScore() {
      sfxClick();
      scores = { p1: 0, p2: 0, draw: 0 };
      level = 1;
      resetRound();
    }

    function updateStatus(customMsg = null) {
      const statusEl = document.getElementById('statusText');
      const scoreEl = document.getElementById('scoreText');

      if (customMsg) {
        statusEl.textContent = customMsg;
      } else if (gameMode === 'ai') {
        statusEl.textContent = currentPlayer === 'X'
          ? `Level ${level} | Your Turn (X)`
          : `Level ${level} | A.I Thinking...`;
      } else {
        statusEl.textContent = currentPlayer === 'X'
          ? `Player 1 Turn (X)`
          : `Player 2 Turn (O)`;
      }

      if (gameMode === 'ai') {
        scoreEl.textContent = `Score → You: ${scores.p1} | A.I: ${scores.p2} | Draw: ${scores.draw}`;
      } else {
        scoreEl.textContent = `Score → P1: ${scores.p1} | P2: ${scores.p2} | Draw: ${scores.draw}`;
      }
    }

    function handleCellClick(idx) {
      if (!gameActive || aiThinking || board[idx] !== '') return;

      makeMove(idx, currentPlayer);

      if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
        aiThinking = true;
        updateStatus();
        setTimeout(() => {
          const aiIdx = getBestAIMove();
          aiThinking = false;
          if (aiIdx !== -1 && gameActive) {
            makeMove(aiIdx, 'O');
          }
        }, 320);
      }
    }

    function makeMove(idx, player) {
      board[idx] = player;
      const cell = document.querySelector(`.cell[data-index="${idx}"]`);
      cell.textContent = player;
      cell.classList.add('taken', player === 'X' ? 'x-mark' : 'o-mark');
      player === 'X' ? sfxMoveX() : sfxMoveO();

      const winCells = checkWinner(board, player);
      if (winCells) {
        gameActive = false;
        winCells.forEach(i => {
          document.querySelector(`.cell[data-index="${i}"]`).classList.add('win-cell');
        });
        handleRoundEnd(player);
        return;
      }

      if (!board.includes('')) {
        gameActive = false;
        handleRoundEnd('draw');
        return;
      }

      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      updateStatus();
    }

    function handleRoundEnd(winner) {
      if (winner === 'X') {
        scores.p1++;
        sfxWin();
        if (gameMode === 'ai') {
          level++;
          updateStatus(`🎉 You Won! Advancing to Level ${level}`);
          recordStats('win');
        } else {
          updateStatus(`🎉 Player 1 (X) Wins!`);
        }
      } else if (winner === 'O') {
        scores.p2++;
        if (gameMode === 'ai') {
          sfxLose();
          updateStatus(`🤖 A.I Won! Try Level ${level} Again`);
          recordStats('loss');
        } else {
          sfxWin();
          updateStatus(`🎉 Player 2 (O) Wins!`);
        }
      } else {
        scores.draw++;
        sfxDraw();
        updateStatus(`🤝 Match Draw!`);
        if (gameMode === 'ai') recordStats('draw');
      }
    }

    function recordStats(result) {
      savedStats.games++;
      if (result === 'win') {
        savedStats.wins++;
        savedStats.currentStreak++;
        if (savedStats.currentStreak > savedStats.bestStreak) {
          savedStats.bestStreak = savedStats.currentStreak;
        }
        if (level > savedStats.maxLevel) {
          savedStats.maxLevel = level;
        }
      } else {
        savedStats.currentStreak = 0;
      }
      localStorage.setItem(STATS_KEY, JSON.stringify(savedStats));
    }

    // Dynamic Win Checker for 3x3, 4x4, 5x5
    function checkWinner(b, player) {
      const N = boardSize;
      const K = winLength;
      const dirs = [
        [0, 1],  // Horizontal
        [1, 0],  // Vertical
        [1, 1],  // Diagonal Down-Right
        [1, -1]  // Diagonal Down-Left
      ];

      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (b[r * N + c] !== player) continue;
          for (const [dr, dc] of dirs) {
            let line = [];
            for (let step = 0; step < K; step++) {
              const nr = r + dr * step;
              const nc = c + dc * step;
              if (nr < 0 || nr >= N || nc < 0 || nc >= N) break;
              if (b[nr * N + nc] === player) {
                line.push(nr * N + nc);
              } else {
                break;
              }
            }
            if (line.length === K) return line;
          }
        }
      }
      return null;
    }

    // Smart AI Engine across all board sizes & difficulties
    function getBestAIMove() {
      const empty = board.map((v, i) => v === '' ? i : -1).filter(i => i !== -1);
      if (empty.length === 0) return -1;

      // Easy: mostly random
      if (difficulty === 'easy') {
        return empty[Math.floor(Math.random() * empty.length)];
      }

      // Medium: 55% smart, 45% casual
      if (difficulty === 'medium' && Math.random() < 0.45) {
        return empty[Math.floor(Math.random() * empty.length)];
      }

      // Hard (or smart branch of Medium):
      // 1. Check immediate AI win
      for (const idx of empty) {
        board[idx] = 'O';
        if (checkWinner(board, 'O')) {
          board[idx] = '';
          return idx;
        }
        board[idx] = '';
      }

      // 2. Block player's immediate win
      for (const idx of empty) {
        board[idx] = 'X';
        if (checkWinner(board, 'X')) {
          board[idx] = '';
          return idx;
        }
        board[idx] = '';
      }

      // 3. Full Minimax for 3x3 Hard mode
      if (boardSize === 3 && difficulty === 'hard') {
        let bestScore = -Infinity;
        let move = empty[0];
        for (const idx of empty) {
          board[idx] = 'O';
          let score = minimax3x3(board, 0, false);
          board[idx] = '';
          if (score > bestScore) {
            bestScore = score;
            move = idx;
          }
        }
        return move;
      }

      // 4. Heuristic center/adjacent positioning for 4x4 and 5x5
      const center = Math.floor((boardSize * boardSize) / 2);
      if (board[center] === '') return center;

      // Prefer cells near existing marks
      let bestMove = empty[0];
      let bestHeuristic = -1;
      for (const idx of empty) {
        let score = 0;
        const r = Math.floor(idx / boardSize);
        const c = idx % boardSize;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < boardSize && nc >= 0 && nc < boardSize) {
              const neighbor = board[nr * boardSize + nc];
              if (neighbor === 'O') score += 3;
              if (neighbor === 'X') score += 2;
            }
          }
        }
        if (score > bestHeuristic) {
          bestHeuristic = score;
          bestMove = idx;
        }
      }
      return bestMove;
    }

    function minimax3x3(b, depth, isMax) {
      if (checkWinner(b, 'O')) return 10 - depth;
      if (checkWinner(b, 'X')) return depth - 10;
      if (!b.includes('')) return 0;

      if (isMax) {
        let best = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === '') {
            b[i] = 'O';
            best = Math.max(best, minimax3x3(b, depth + 1, false));
            b[i] = '';
          }
        }
        return best;
      } else {
        let best = Infinity;
        for (let i = 0; i < 9; i++) {
          if (b[i] === '') {
            b[i] = 'X';
            best = Math.min(best, minimax3x3(b, depth + 1, true));
            b[i] = '';
          }
        }
        return best;
      }
    }

    // Stats Modal Controls
    function openStats() {
      sfxClick();
      document.getElementById('stGames').textContent = savedStats.games;
      const rate = savedStats.games > 0 ? Math.round((savedStats.wins / savedStats.games) * 100) : 0;
      document.getElementById('stWinRate').textContent = rate + '%';
      document.getElementById('stStreak').textContent = savedStats.bestStreak;
      document.getElementById('stMaxLevel').textContent = savedStats.maxLevel;
      document.getElementById('statsModal').classList.add('open');
    }

    function closeStats() {
      sfxClick();
      document.getElementById('statsModal').classList.remove('open');
    }

    function clearSavedStats() {
      sfxClick();
      savedStats = { games: 0, wins: 0, currentStreak: 0, bestStreak: 0, maxLevel: 1 };
      localStorage.setItem(STATS_KEY, JSON.stringify(savedStats));
      openStats();
    }

    // Initialize Game
    resetRound();
  </script>
